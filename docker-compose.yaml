# The app is the default service. PostgreSQL and RustFS are optional
# dependencies behind profiles:
#   docker compose up -d --build
#   docker compose --profile postgres up -d
#   docker compose --profile rustfs up -d
#   docker compose --profile postgres --profile rustfs up -d
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${DEFAULT_LOG_MAX_SIZE:-100m}
      max-file: ${DEFAULT_LOG_MAX_FILE:-3}

services:
  chatroom:
    <<: *defaults
    image: ${DOCKER_REGISTRY:-ghcr.io}/${SERVICE_NAME:-agentsyaml/opencode-chat-room}:${BUILD_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    ports:
      - "${CHAT_ROOM_PORT_OVERRIDE:-4399}:4399"
    environment:
      CHAT_ROOM_SERVER_HOST: "0.0.0.0"
      CHAT_ROOM_SERVER_PORT: "4399"
      CHAT_ROOM_STATE_DIR: "/data"
      NODE_ENV: "production"
      # Fail closed when the token is missing instead of exposing an open room.
      CHAT_ROOM_SERVER_TOKEN: ${CHAT_ROOM_SERVER_TOKEN:?set CHAT_ROOM_SERVER_TOKEN in .env before starting Compose}
    healthcheck:
      # The image has Node but not curl or wget; /chat is public and returns 200.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4399/chat').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - chatroom-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rustfs:
        condition: service_started
        required: false
    build:
      context: .
      dockerfile: Dockerfile

  # Optional PostgreSQL state backend. Set CHAT_ROOM_DATABASE_URL in .env:
  # postgresql://chatroom:CHANGEME@postgres:5432/chatroom
  postgres:
    <<: *defaults
    profiles: ["postgres"]
    image: ${DOCKER_REGISTRY:-docker.io}/postgres:${POSTGRES_VERSION:-16-alpine}
    ports:
      - "${POSTGRES_PORT_OVERRIDE:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME}
      POSTGRES_DB: ${POSTGRES_DB:-chatroom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatroom} -d ${POSTGRES_DB:-chatroom}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional S3-compatible storage. Set CHAT_ROOM_STORAGE=s3 and the bucket
  # variables in .env so the app stores resources in this bucket.
  rustfs:
    <<: *defaults
    profiles: ["rustfs"]
    image: ${DOCKER_REGISTRY:-docker.io}/rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    ports:
      - "${RUSTFS_ADDRESS_PORT_OVERRIDE:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT_OVERRIDE:-9001}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-CHANGEME}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-CHANGEME}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs

volumes:
  chatroom-data:
  postgres-data:
  rustfs-data:
  rustfs-logs: