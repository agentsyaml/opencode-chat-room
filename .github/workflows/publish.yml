name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: node -e 'const fs = require("node:fs"); const { version } = JSON.parse(fs.readFileSync("package.json", "utf8")); const expected = `v${version}`; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Expected tag ${expected}, got ${process.env.GITHUB_REF_NAME}`); process.exit(1); }'

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
