<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>闲叙 · 轻量聊天室</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    --font-sans: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --font-serif: "Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    --font-mono: ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --bg: #f4f1ea;
    --surface: #fdfcf8;
    --surface-2: #ece9df;
    --ink: #2a2721;
    --ink-2: #777162;
    --ink-3: #847c69;
    --line: #e2ddd0;
    --accent: #b85a35;
    --accent-ink: #fdf6ef;
    --accent-soft: #f6e3d6;
    --danger: #b23a2e;
    --danger-soft: #f9e7e2;
    --mention-blue: #2e6cc4;
    --shadow: 0 1px 2px rgb(48 38 25 / .05), 0 12px 32px rgb(48 38 25 / .08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150f;
      --surface: #211e18;
      --surface-2: #2c2820;
      --ink: #eae5d8;
      --ink-2: #a19a88;
      --ink-3: #8a8372;
      --line: #322e25;
      --accent: #dd8761;
      --accent-ink: #241208;
      --accent-soft: #3b2418;
      --danger: #e27a6c;
      --danger-soft: #3a201b;
      --mention-blue: #86a9ee;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .45);
    }
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -8%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 65%),
      var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--accent-soft); }

  #app {
    max-width: 760px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* ── 视图 ── */
  .view { flex: 1; min-height: 0; }
  #joinView {
    display: flex;
    overflow-y: auto;
    padding: 40px 20px;
    animation: rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  #chatView { display: flex; flex-direction: column; animation: view-in .3s ease both; }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes view-in { from { opacity: 0; } }
  @keyframes msg-in { from { opacity: 0; transform: translateY(5px); } }
  @keyframes pulse { 50% { opacity: .35; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── 加入 / 创建 ── */
  .join-card {
    width: 100%;
    max-width: 424px;
    margin: auto;
    padding: 36px 32px 30px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .wordmark {
    margin: 0;
    font-family: var(--font-serif);
    font-size: 30px;
    letter-spacing: .14em;
    color: var(--ink);
  }
  .tagline { margin: 8px 0 26px; font-size: 13.5px; color: var(--ink-2); }

  .field { display: block; margin-bottom: 14px; }
  .field-label {
    display: block;
    margin-bottom: 6px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink-2);
  }

  .input {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 防止 iOS 聚焦时缩放 */
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: var(--ink-3); }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    border-radius: 10px;
    padding: 11px 18px;
    transition: filter .15s, transform .1s, border-color .15s, color .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:not(:disabled):hover { filter: brightness(1.07); }
  .btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
  .btn.ghost:not(:disabled):hover { color: var(--ink); border-color: var(--ink-3); }
  .btn.small { padding: 8px 14px; font-size: 13.5px; }
  .btn:focus-visible, .chip:focus-visible, .room-row:focus-visible, .input:focus-visible,
  .jump:focus-visible, .copy-id:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #joinForm .btn.primary, #createForm .btn.ghost { width: 100%; margin-top: 4px; }

  .or { display: flex; align-items: center; gap: 12px; margin: 18px 0; font-size: 12.5px; color: var(--ink-3); }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .alert {
    margin-top: 16px;
    padding: 10px 13px;
    border-radius: 10px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13.5px;
    word-break: break-word;
  }

  .hint { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }

  .token-box { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .token-box summary {
    cursor: pointer;
    padding: 11px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-2);
    list-style: none;
  }
  .token-box summary::-webkit-details-marker { display: none; }
  .token-box summary::marker { content: none; }
  .token-box summary::after { content: "▾"; margin-left: 6px; font-size: 11px; color: var(--ink-3); }
  .token-box[open] summary::after { content: "▴"; }
  .token-body { padding: 0 14px 14px; }
  .token-body .btn { margin-top: 10px; }

  .room-list { margin-top: 22px; }
  .room-list h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--ink-2); }
  #roomList { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
  .room-row {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    padding: 9px 44px 9px 11px;
    font: inherit;
    text-align: left;
    color: var(--ink);
    background: none;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .room-row:hover { background: var(--surface-2); border-color: var(--line); }
  .r-name { font-weight: 600; font-size: 14px; }
  .r-meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .r-go {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    opacity: 0;
    transition: opacity .12s;
  }
  .room-row:hover .r-go, .room-row:focus-visible .r-go { opacity: 1; }

  /* ── 聊天 ── */
  .chat-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .chat-head-main h1 { margin: 0; font-family: var(--font-serif); font-size: 19px; letter-spacing: .02em; }
  .room-meta { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); }
  .mono { font-family: var(--font-mono); }
  .copy-id {
    appearance: none;
    font: inherit;
    font-size: 12px;
    color: var(--ink-3);
    background: none;
    border: none;
    border-bottom: 1px dashed var(--ink-3);
    padding: 0 0 1px;
    cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .copy-id:hover { color: var(--accent); border-color: var(--accent); }
  .copy-id .copy-ok { display: none; }
  .copy-id.copied .mono { display: none; }
  .copy-id.copied .copy-ok { display: inline; color: var(--accent); }

  .chat-head-actions { display: flex; align-items: center; gap: 8px; }
  .chip {
    appearance: none;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-3); }
  .chip.danger { color: var(--danger); }
  .chip.danger:hover { border-color: var(--danger); background: var(--danger-soft); }

  .anchor { position: relative; }
  .panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: min(320px, calc(100vw - 32px));
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    animation: rise .18s ease both;
  }
  .panel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .panel .btn { margin-top: 10px; }
  #memberList { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  #memberList li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  #memberList li:last-child { border-bottom: none; }
  .m-time { font-size: 11.5px; color: var(--ink-3); }

  .conn-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px;
    font-size: 12.5px;
    color: var(--ink-2);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }

  .msg-scroll {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .thread {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 22px 22px 6px;
  }
  #msgList { list-style: none; margin: 0; padding: 0; }

  .thread, #roomList, #memberList {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--ink-3) 40%, transparent) transparent;
  }
  .thread::-webkit-scrollbar, #roomList::-webkit-scrollbar, #memberList::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb, #roomList::-webkit-scrollbar-thumb, #memberList::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--ink-3) 40%, transparent);
    border-radius: 4px;
  }
  .thread::-webkit-scrollbar-track { background: transparent; }

  .jump {
    position: absolute;
    right: 20px;
    bottom: 16px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: filter .12s, transform .1s;
  }
  .jump:hover { filter: brightness(1.07); }
  .jump:active { transform: translateY(1px); }
  .jump .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-ink);
    border-radius: 999px;
  }

  .msg { display: flex; flex-direction: column; margin-bottom: 14px; }
  .msg.in, .sys.in, .day-sep.in { animation: msg-in .25s ease both; }
  .msg.own { align-items: flex-end; }
  .msg.repeat { margin-bottom: 8px; }
  .msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .msg-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .msg.own .msg-name { color: var(--accent); }
  .msg.repeat .msg-name { display: none; }
  .msg-time { font-size: 11.5px; color: var(--ink-3); }
  .msg-text {
    display: inline-block;
    max-width: min(86%, 540px);
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--surface-2);
    border-bottom-left-radius: 4px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-line; /* Markdown 依赖换行：保留 \n，折叠连续空格 */
    overflow-wrap: anywhere;
  }
  .msg.own .msg-text { background: var(--accent-soft); border-bottom-left-radius: 14px; border-bottom-right-radius: 4px; }

  /* ── 消息内 Markdown 元素 ── */
  .msg-text p, .msg-text pre, .msg-text blockquote, .msg-text ul, .msg-text ol { margin: 0; }
  .msg-text > :not(:first-child) { margin-top: 8px; }
  .msg-text ul, .msg-text ol { padding-left: 22px; }
  .msg-text li { margin: 2px 0; }
  .msg-text blockquote {
    padding: 1px 0 1px 12px;
    border-left: 3px solid var(--ink-3);
    color: var(--ink-2);
  }
  .msg-text code {
    font-family: var(--font-mono);
    font-size: .9em;
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    border-radius: 5px;
    padding: 0 4px;
  }
  .msg-text pre {
    overflow-x: auto; /* 长代码行横向滚动，不折行 */
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    font-size: 13.5px;
    line-height: 1.55;
  }
  .msg-text pre code {
    display: block;
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
    white-space: pre;
  }
  .msg-text a {
    color: var(--mention-blue);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .msg-text a:hover { text-decoration: none; }

  /* ── @提及 ── */
  /* 默认：灰调（成员已离开 / 改名 / 从未加入）；.member：蓝色高亮（当前房间成员） */
  .mention-chip {
    display: inline-block;
    margin: 0 1px;
    padding: 2px 7px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    /* 对齐：middle 相对父元素 x-height 中点居中——CJK 与 Latin 混排时
       都比基线微调（-0.15em 对中文仍偏上）更稳；line-height:1 让药丸
       高度只由自身字号+内边距决定，不撑高行盒 */
    vertical-align: middle;
    line-height: 1;
    font-size: .92em;
    font-weight: 600;
    color: var(--ink-2);
    background: color-mix(in srgb, var(--ink-2) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink-2) 26%, transparent);
    border-radius: 999px;
  }
  .mention-chip.member {
    color: var(--mention-blue);
    background: color-mix(in srgb, var(--mention-blue) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--mention-blue) 32%, transparent);
  }

  .mention-picker {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(100% + 8px);
    z-index: 30;
    max-height: 224px;
    overflow-y: auto;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    animation: rise .15s ease both;
  }
  .mention-picker ul { list-style: none; margin: 0; padding: 0; position: relative; }
  .mention-opt {
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mention-opt:hover { background: var(--surface-2); }
  .mention-opt.active { background: var(--accent-soft); color: var(--accent); }
  .mention-at { font-weight: 600; color: var(--accent); margin-right: 4px; }
  .mention-hit { background: color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 3px; }
  .mention-empty { margin: 0; padding: 12px 8px; font-size: 13px; color: var(--ink-3); text-align: center; }
  .mention-hint {
    margin: 6px 0 2px;
    padding: 7px 8px 0;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--ink-3);
    text-align: center;
  }

  .sys {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .sys::before, .sys::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sys span { flex-shrink: 0; }

  .day-sep {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--ink-2);
  }
  .day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .gap { padding: 6px 0 2px; text-align: center; font-size: 12px; color: var(--ink-3); }

  .chat-empty { padding: 56px 0 40px; text-align: center; font-size: 13px; color: var(--ink-3); }
  .chat-empty::before {
    content: "";
    display: block;
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border: 1.5px dashed var(--line);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--ink-3) 0 3px, transparent 4px);
  }

  .composer {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .composer-row { display: flex; gap: 10px; align-items: flex-end; }
  .composer .input { flex: 1; }
  .composer .input:disabled { opacity: .5; }
  #msgInput {
    min-height: 46px;
    max-height: 132px;
    padding: 12px 13px;
    line-height: 1.5;
    resize: none;
    overflow-y: auto;
  }
  #btnSend { padding: 12px 22px; }
  .send-error { margin: 0; font-size: 12.5px; color: var(--danger); }

  @media (max-width: 560px) {
    #joinView { padding: 20px 14px; }
    .join-card { padding: 28px 22px 24px; }
    .chat-head { padding: 12px 16px; }
    .thread { padding: 16px 16px 4px; }
    .jump { right: 12px; bottom: 10px; }
  }
</style>
</head>
<body>

<main id="app">

  <!-- ── 加入 / 创建 ── -->
  <section id="joinView" class="view">
    <div class="join-card">
      <p class="wordmark">闲叙</p>
      <p class="tagline">一个轻量的聊天房间。输入房间 ID 加入，或直接新建一个。</p>

      <form id="joinForm" novalidate>
        <label class="field">
          <span class="field-label">房间 ID</span>
          <input id="inRoomId" class="input" placeholder="粘贴或输入房间 ID" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span class="field-label">你的昵称</span>
          <input id="inName" class="input" placeholder="怎么称呼你" autocomplete="nickname" maxlength="24">
        </label>
        <button class="btn primary" type="submit" id="btnJoin">加入房间</button>
      </form>

      <div class="or"><span>或</span></div>

      <form id="createForm" novalidate>
        <label class="field">
          <span class="field-label">新房间名称</span>
          <input id="inRoomName" class="input" placeholder="例如：周末电影夜" maxlength="40">
        </label>
        <button class="btn ghost" type="submit" id="btnCreate">创建新房间</button>
      </form>

      <div id="joinError" class="alert" role="alert" hidden></div>

      <details id="tokenBox" class="token-box">
        <summary>访问令牌（可选）</summary>
        <div class="token-body">
          <label class="field">
            <span class="field-label">Bearer Token</span>
            <input id="inToken" class="input" type="password" placeholder="服务器要求时填写" autocomplete="off" spellcheck="false">
          </label>
          <button class="btn ghost small" type="button" data-token-save="inToken">保存</button>
          <p class="hint">若服务器设置了访问令牌（401），所有请求都会带上它。</p>
        </div>
      </details>

      <section class="room-list">
        <h2>已有房间</h2>
        <ul id="roomList"></ul>
        <p id="roomListEmpty" class="hint" hidden>还没有房间，创建一个吧。</p>
      </section>
    </div>
  </section>

  <!-- ── 聊天 ── -->
  <section id="chatView" class="view" hidden>
    <header class="chat-head">
      <div class="chat-head-main">
        <h1 id="roomName"></h1>
        <p class="room-meta">
          <button type="button" id="btnCopyId" class="copy-id" aria-label="复制房间 ID" title="点击复制完整房间 ID">
            <span class="mono" id="roomIdShort"></span><span class="copy-ok">已复制</span>
          </button>
        </p>
      </div>
      <div class="chat-head-actions">
        <div class="anchor">
          <button class="chip" type="button" id="btnMembers" aria-haspopup="true" aria-expanded="false">成员</button>
          <div class="panel" id="memberPanel" hidden>
            <h3>成员</h3>
            <ul id="memberList"></ul>
            <p id="memberEmpty" class="hint" hidden>暂无成员</p>
          </div>
        </div>
        <div class="anchor">
          <button class="chip" type="button" id="btnSettings" aria-haspopup="true" aria-expanded="false">设置</button>
          <div class="panel" id="chatSettings" hidden>
            <h3>设置</h3>
            <label class="field">
              <span class="field-label">访问令牌（可选）</span>
              <input id="inTokenChat" class="input" type="password" placeholder="服务器要求时填写" autocomplete="off" spellcheck="false">
            </label>
            <button class="btn ghost small" type="button" data-token-save="inTokenChat">保存</button>
            <p id="tokenHint" class="hint" hidden>服务器要求访问令牌（401）。</p>
          </div>
        </div>
        <button class="chip danger" type="button" id="btnLeave">离开</button>
      </div>
    </header>

    <div id="connBar" class="conn-bar" hidden aria-live="polite">
      <span class="pulse"></span>
      <span>连接中断，正在重试…</span>
    </div>

    <div id="msgScroll" class="msg-scroll">
      <div id="thread" class="thread">
        <ul id="msgList" aria-label="消息列表"></ul>
        <p id="msgEmpty" class="chat-empty">还没有消息，说点什么吧。</p>
      </div>
      <button type="button" id="btnJump" class="jump" aria-label="回到最新消息" hidden>
        <span aria-hidden="true">↓</span><span class="badge" id="jumpBadge" hidden></span>
      </button>
    </div>

    <footer class="composer">
      <p id="sendError" class="send-error" role="alert" hidden></p>
      <div id="mentionPicker" class="mention-picker" role="listbox" aria-label="选择要提及的成员" hidden></div>
      <div class="composer-row">
        <textarea id="msgInput" class="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行" autocomplete="off" aria-autocomplete="list" aria-controls="mentionPicker" aria-expanded="false" disabled></textarea>
        <button class="btn primary" type="button" id="btnSend" disabled>发送</button>
      </div>
    </footer>
  </section>

</main>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);

  /* ---------- 本地存储（隐私模式下 localStorage 可能抛错，回退到内存） ---------- */
  const memStore = {};
  function lsGet(k) {
    try { return localStorage.getItem(k); }
    catch { return k in memStore ? memStore[k] : null; }
  }
  function lsSet(k, v) {
    try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
    catch { if (v == null) delete memStore[k]; else memStore[k] = v; }
  }
  const LS = {
    get sessionID() {
      // ponytail: sessionID 必须 tab 级独立（sessionStorage）——localStorage
      // 会被同一浏览器的多个 tab 共享，一个 tab 的 /read 推进会吃掉另一个
      // tab 未读窗口的消息（orc-1 #1）
      let v = null;
      try { v = sessionStorage.getItem("chat.sessionID"); } catch { /* ignore */ }
      if (!v) {
        v = crypto.randomUUID();
        try { sessionStorage.setItem("chat.sessionID", v); } catch { /* ignore */ }
      }
      return v;
    },
    get roomId() { return lsGet("chat.roomId") || ""; },
    set roomId(v) { lsSet("chat.roomId", v || null); },
    get name() { return lsGet("chat.name") || ""; },
    set name(v) { lsSet("chat.name", v || null); },
    get token() { return lsGet("chat.token") || ""; },
    set token(v) { lsSet("chat.token", v || null); },
  };

  /* ---------- 请求 ---------- */
  async function api(path, opts = {}) {
    const headers = {};
    if (opts.body) headers["Content-Type"] = "application/json";
    if (LS.token) headers.Authorization = `Bearer ${LS.token}`;
    let res;
    try {
      res = await fetch(path, { ...opts, headers });
    } catch {
      const e = new Error("网络连接失败");
      e.network = true;
      throw e;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const e = new Error(data.error || `请求失败（HTTP ${res.status}）`);
      e.status = res.status;
      throw e;
    }
    return data;
  }

  /* ---------- 状态 ---------- */
  const state = { room: null, myName: "", rendered: 0, firstMsgId: null, polling: false, unread: 0, copyT: 0 };
  // orc-2 #3——渲染失败的消息 id；对账时据此强制重建重试
  const failedRenderIds = new Set();
  let lastFocus = null;
  let pollDelay = 2000;

  /* ---------- 工具 ---------- */
  function fmtTime(ts) {
    const d = new Date(ts);
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay ? `今天 ${hm}` : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
  }

  function timeHM(ts) {
    return new Date(ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  }

  function dayText(ts) {
    const d = new Date(ts);
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((today - that) / 86400000);
    if (diff === 0) return "今天";
    if (diff === 1) return "昨天";
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function fmtSys(text) {
    return String(text)
      .replace(/^(.*?)\s+joined the room$/, "$1 加入了房间")
      .replace(/^(.*?)\s+left the room$/, "$1 离开了房间");
  }

  function flash(btn, msg) {
    const old = btn.textContent;
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = old; }, 1200);
  }

  /* ---------- 发送框 ---------- */
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 132) + "px";
  }
  function updateSendState() {
    $("#btnSend").disabled = !$("#msgInput").value.trim();
  }

  /* ---------- 回到底部与未读 ---------- */
  function jumpToBottom() {
    state.unread = 0;
    $("#thread").scrollTop = $("#thread").scrollHeight;
    updateBadge();
    updateJump();
  }
  function updateJump() {
    const sc = $("#thread");
    const away = sc.scrollHeight - sc.scrollTop - sc.clientHeight > 160;
    $("#btnJump").hidden = !(away || state.unread > 0);
  }
  function updateBadge() {
    const b = $("#jumpBadge");
    b.textContent = state.unread > 99 ? "99+" : state.unread;
    b.hidden = state.unread === 0;
    updateTitle();
  }
  function updateTitle() {
    const base = state.room ? `${state.room.name} · 闲叙` : "闲叙 · 轻量聊天室";
    document.title = state.unread > 0 ? `(${state.unread}) ${base}` : base;
  }

  /* ---------- 长会话截断 ---------- */
  function trimList() {
    const list = $("#msgList");
    const MAX = 400, KEEP = 300;
    if (list.children.length <= MAX) return;
    while (list.children.length > KEEP) list.removeChild(list.firstChild);
    if (list.firstElementChild && !list.firstElementChild.classList.contains("gap")) {
      const gap = document.createElement("li");
      gap.className = "gap";
      gap.textContent = "更早的消息已省略";
      list.insertBefore(gap, list.firstChild);
    }
  }

  /* ---------- 复制房间 ID ---------- */
  function copyRoomId() {
    const done = () => {
      const b = $("#btnCopyId");
      b.classList.add("copied");
      clearTimeout(state.copyT);
      state.copyT = setTimeout(() => b.classList.remove("copied"), 1400);
    };
    const id = state.room.id;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(done).catch(() => fallbackCopy(id, done));
    } else fallbackCopy(id, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch { /* 忽略 */ }
    ta.remove();
  }

  /* ---------- 视图切换 ---------- */
  function showJoin() {
    $("#chatView").hidden = true;
    $("#joinView").hidden = false;
    updateTitle();
    refreshRoomList();
    $("#inRoomId").focus();
  }
  function showChat() {
    $("#joinView").hidden = true;
    $("#chatView").hidden = false;
  }

  /* ---------- 加入 / 创建 ---------- */
  function showJoinError(msg) {
    const el = $("#joinError");
    el.textContent = msg;
    el.hidden = false;
  }
  function hideJoinError() { $("#joinError").hidden = true; }
  function setJoinBusy(b) {
    $("#btnJoin").disabled = b;
    $("#btnCreate").disabled = b;
  }

  function joinRoom() {
    const roomId = $("#inRoomId").value.trim();
    const name = $("#inName").value.trim();
    if (!roomId) return showJoinError("请输入房间 ID");
    if (!name) return showJoinError("请输入你的昵称");
    doJoin(roomId, name);
  }

  async function doJoin(roomId, name) {
    setJoinBusy(true);
    hideJoinError();
    try {
      const room = await api(`/rooms/${encodeURIComponent(roomId)}/join`, {
        method: "POST",
        body: JSON.stringify({ sessionID: LS.sessionID, participantId: name, participantName: name }),
      });
      enterRoom(room, name);
    } catch (e) {
      if (e.status === 401) { openTokenBox(); showJoinError("服务器要求访问令牌，请填写后重试"); }
      else if (e.network) showJoinError("无法连接服务器，请检查网络后重试");
      else showJoinError(`加入失败：${e.message}`);
    } finally {
      setJoinBusy(false);
    }
  }

  async function createRoom() {
    const roomName = $("#inRoomName").value.trim();
    const displayName = $("#inName").value.trim() || "访客";
    if (!roomName) return showJoinError("请输入房间名称");
    setJoinBusy(true);
    hideJoinError();
    try {
      const room = await api("/rooms", {
        method: "POST",
        body: JSON.stringify({ name: roomName, ownerId: displayName, sessionID: LS.sessionID }),
      });
      enterRoom(room, displayName);
    } catch (e) {
      if (e.status === 401) { openTokenBox(); showJoinError("服务器要求访问令牌，请填写后重试"); }
      else if (e.network) showJoinError("无法连接服务器，请检查网络后重试");
      else showJoinError(`创建失败：${e.message}`);
    } finally {
      setJoinBusy(false);
    }
  }

  function enterRoom(room, myName) {
    state.room = room;
    state.myName = myName;
    state.rendered = 0;
    state.firstMsgId = null;
    state.unread = 0;
    LS.roomId = room.id;
    LS.name = myName;
    showChat();
    renderHead();
    appendMessages(false);
    renderMembers();
    setOnline(true);
    hideSendError();
    startPolling();
    $("#msgInput").disabled = false;
    updateSendState();
    updateJump();
    $("#msgInput").focus();
  }

  function renderHead() {
    $("#roomName").textContent = state.room.name;
    $("#roomIdShort").textContent = state.room.id.slice(0, 8);
    $("#btnCopyId").title = `复制完整房间 ID：${state.room.id}`;
    updateTitle();
  }

  /* ---------- 消息 ---------- */
  function renderMessage(m, live) {
    const li = document.createElement("li");
    li.dataset.sender = m.senderId;
    li.dataset.ts = m.createdAt;
    li.dataset.msgId = m.id;
    if (m.senderId === "system") {
      li.className = "sys";
      const span = document.createElement("span");
      span.textContent = fmtSys(m.text);
      li.appendChild(span);
    } else {
      const own = m.senderId === state.myName;
      li.className = "msg" + (own ? " own" : "");
      const meta = document.createElement("div");
      meta.className = "msg-meta";
      const nm = document.createElement("span");
      nm.className = "msg-name";
      nm.textContent = own ? "我" : m.senderId;
      const tm = document.createElement("span");
      tm.className = "msg-time";
      tm.textContent = timeHM(m.createdAt);
      meta.append(nm, tm);
      const tx = document.createElement("div");
      tx.className = "msg-text";
      renderTextWithMentions(tx, m.text);
      li.append(meta, tx);
    }
    if (live) li.classList.add("in");
    return li;
  }

  function appendMessages(live) {
    const scroll = $("#thread");
    const list = $("#msgList");
    const msgs = state.room.messages;
    // ponytail: the server trims history to 500 — when the head changes,
    // index-based tracking would stall forever (length stays pinned at 500),
    // so rebuild the list once from scratch
    let rebuild = false;
    let anchorId = null;
    if (msgs.length && msgs[0].id !== state.firstMsgId) {
      // remember the first visible message to restore the scroll position
      const firstVisible = Array.from(list.children).find((el) =>
        el.classList.contains("msg"),
      );
      if (firstVisible) anchorId = firstVisible.dataset.msgId || null;
      list.textContent = "";
      state.rendered = 0;
      rebuild = true;
    }
    if (rebuild) live = false;
    const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80;
    let appended = 0;
    let skipped = 0; // orc-3 #1——渲染失败计数（此前未声明 → ReferenceError）
    let last = list.lastElementChild;
    // ponytail: 防御性去重——发送回显（send.then 全量替换+渲染）与长轮询
    // echo（inbox excludeSelf=0）可能把同一条消息带进渲染区间，按 id
    // 跳过已渲染节点，确保任何并发路径下都不产生重复消息节点
    const renderedIds = new Set(
      Array.from(list.children)
        .map((el) => el.dataset.msgId)
        .filter(Boolean),
    );
    for (let i = state.rendered; i < msgs.length; i++) {
      const m = msgs[i];
      if (renderedIds.has(m.id)) continue;
      // ponytail: 单条消息渲染容错——一条坏消息（渲染抛异常）绝不能卡死
      // 整批渲染（否则后续消息全部不可见 = "Agent 消息丢失"）；跳过它并
      // 继续渲染其余，统计 skipped 供调用方决定水位推进
      try {
        const day = new Date(m.createdAt).toDateString();
        if (!last || last.dataset.day !== day) {
          const sep = document.createElement("li");
          sep.className = "day-sep";
          sep.dataset.day = day;
          sep.textContent = dayText(m.createdAt);
          list.appendChild(sep);
          last = sep;
        }
        const li = renderMessage(m, live);
        li.dataset.day = day;
        // 同一人 8 分钟内连发：省略重复名字，间距收紧
        if (last.classList.contains("msg") && last.dataset.sender === m.senderId
            && m.createdAt - +last.dataset.ts < 8 * 60 * 1000) {
          li.classList.add("repeat");
        }
        list.appendChild(li);
        last = li;
      } catch (err) {
        console.error("[chat] 单条消息渲染失败，跳过:", m.id, err);
        skipped++;
        failedRenderIds.add(m.id); // orc-2 #3——对账时据此强制重建重试
      }
      renderedIds.add(m.id);
      appended++;
    }
    state.rendered = msgs.length;
    state.firstMsgId = msgs.length ? msgs[0].id : state.firstMsgId;
    $("#msgEmpty").hidden = msgs.length > 0;
    // 初次进入直接到底；增量到达时只有本来就在底部才跟随；重建时恢复锚点
    if (rebuild && anchorId) {
      const anchor = list.querySelector(`[data-msg-id="${CSS.escape(anchorId)}"]`);
      if (anchor) {
        const top = anchor.getBoundingClientRect().top - scroll.getBoundingClientRect().top;
        scroll.scrollTop += top - 40;
      } else {
        scroll.scrollTop = scroll.scrollHeight;
      }
    } else if (msgs.length && (live ? nearBottom : true)) {
      scroll.scrollTop = scroll.scrollHeight;
    }
    // 未读计数已统一在 poll 层处理（rebuild 场景 live=false 也能计数）
    updateJump();
    trimList();
    return { skipped };
  }

  function renderMembers() {
    const parts = state.room.participants || [];
    $("#btnMembers").textContent = `成员 ${parts.length}`;
    const list = $("#memberList");
    list.textContent = "";
    for (const p of parts) {
      const li = document.createElement("li");
      const nm = document.createElement("span");
      nm.textContent = p.name;
      const tm = document.createElement("span");
      tm.className = "m-time";
      tm.textContent = fmtTime(p.joinedAt);
      li.append(nm, tm);
      list.appendChild(li);
    }
    $("#memberEmpty").hidden = parts.length > 0;
    if (mention.active) updateMentionList(mention.query); // 成员刷新时同步提及候选
  }

  /* ---------- 轮询（失败时指数退避，恢复后回到 2s） ---------- */
  // ponytail: 串行轮询——poll 完成（含长轮询挂起）后才等待间隔再下一轮，
  // 绝不多个轮询并发叠加；generation 计数器保证 leave+rejoin 后旧循环
  // 立即终止（ora-1 #1：否则 25s 在途的旧 poll 会让两条循环永久并存）
  function startPolling() {
    stopPolling();
    state.pollGen = (state.pollGen ?? 0) + 1;
    state.polling = true;
    pollDelay = 2000;
    void pollLoop(state.pollGen);
  }
  async function pollLoop(gen) {
    while (state.polling && state.room && gen === state.pollGen) {
      await poll().catch(() => {});
      if (!state.polling || gen !== state.pollGen) break;
      await new Promise((r) => setTimeout(r, pollDelay));
    }
  }
  function stopPolling() {
    state.polling = false;
  }

  async function poll() {
    if (!state.room) return;
    const roomId = state.room.id; // 请求发起时的房间（ora-2 M1：防过期响应串房）
    try {
      // ponytail: 25s 长轮询（串行 pollLoop 保证同一时刻只有一个请求）
      const q = new URLSearchParams({
        sessionID: LS.sessionID,
        roomId,
        excludeSelf: "0",
        timeout: "25000",
      });
      const data = await api(`/inbox?${q}`);
      // 长轮询挂起期间离开/换房：丢弃过期响应，绝不污染新房间
      if (!state.room || state.room.id !== roomId) return;
      if (!data.member) {
        leaveRoom(true);
        showJoinError("房间不存在或已被删除");
        return;
      }
      const items = Array.isArray(data.items) ? data.items : [];
      if (items.length) {
        const msgs = state.room.messages;
        const known = new Set(msgs.map((m) => m.id));
        let maxTs = 0;
        let sawSystem = false;
        let newCount = 0;
        for (const it of items) {
          maxTs = Math.max(maxTs, it.createdAt);
          if (it.senderId === "system") sawSystem = true;
          if (known.has(it.id)) continue;
          msgs.push({
            id: it.id,
            roomId: state.room.id,
            senderId: it.senderId,
            text: it.text,
            createdAt: it.createdAt,
          });
          newCount++;
        }
        // ponytail: mirror the server's 500-message trim locally so the
        // rebuild-on-head-change path fires like before
        if (msgs.length > 500) msgs.splice(0, msgs.length - 500);
        // ponytail: 渲染成功才推进水位——渲染失败（含单条跳过）时消息不得
        // 标记已读，否则消息"已读"但未显示（不刷新就永久丢）；跳过即强制
        // 对账重试
        let rendered = true;
        try {
          const { skipped } = appendMessages(true);
          if (skipped > 0) {
            rendered = false;
            state.lastReconcileAt = 0; // 强制下一次 poll 全量对账
          }
        } catch (err) {
          rendered = false;
          state.lastReconcileAt = 0;
          console.error("[chat] 渲染失败，水位不推进，立即对账:", err);
        }
        if (sawSystem) refreshRoomMeta(); // 成员进出事件后同步成员列表
        // ponytail: ora-1 #3 — 未读计数在 poll 层统一统计（rebuild 场景
        // appendMessages 以 live=false 渲染，原计数逻辑会漏掉角标）
        if (newCount > 0) {
          const sc = $("#thread");
          const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
          if (!nearBottom || document.hidden) {
            state.unread += newCount;
            updateBadge();
          }
        }
        // advance our own watermark only after successful render
        if (rendered && maxTs > 0) {
          void api("/read", {
            method: "POST",
            body: JSON.stringify({ roomId: state.room.id, sessionID: LS.sessionID, ts: maxTs }),
          }).catch(() => {});
        }
      }
      // ponytail: 周期性全量对账（每 2 分钟）——拉房间全量按 msgId 补漏，
      // 兜底水位竞态/渲染跳过等任何口子，保证 Agent 消息永不丢
      if (!state.lastReconcileAt || Date.now() - state.lastReconcileAt > 120000) {
        state.lastReconcileAt = Date.now();
        void reconcileFull();
      }
      setOnline(true);
      pollDelay = 2000;
    } catch (e) {
      if (!state.room || state.room.id !== roomId) return; // 过期错误不处理
      if (e.status === 401) {
        setOnline(false);
        if ($("#chatSettings").hidden) openChatSettings(); // 只弹一次，避免抢焦点
        pollDelay = Math.min(pollDelay * 2, 30000); // 配置问题——退避
      } else if (e.status === 404) {
        leaveRoom(true);
        showJoinError("房间不存在或已被删除");
        return;
      } else {
        setOnline(false); // 网络/服务器重启等暂时性错误——固定 2s 快速重试
        pollDelay = 2000;
      }
    }
  }

  // ponytail: 全量对账——拉房间全量（500 cap 内）按 msgId 补缺失并重建渲染，
  // 确保任何情况下前端与服务器一致（多 tab 各自独立 sessionID，互不影响）
  async function reconcileFull() {
    if (!state.room) return;
    const roomId = state.room.id;
    try {
      const room = await api(`/rooms/${encodeURIComponent(roomId)}`);
      if (!state.room || state.room.id !== roomId) return;
      const msgs = state.room.messages;
      const known = new Set(msgs.map((m) => m.id));
      const missing = (room.messages || []).filter((m) => !known.has(m.id));
      // orc-2 #3——渲染失败的消息在数组里（missing 为空），但需要重建重试
      if (missing.length === 0 && failedRenderIds.size === 0) return; // 一致
      for (const m of missing) {
        let i = msgs.length;
        while (i > 0 && msgs[i - 1].createdAt > m.createdAt) i--;
        msgs.splice(i, 0, m);
      }
      if (msgs.length > 500) msgs.splice(0, msgs.length - 500);
      const list = $("#msgList");
      list.textContent = ""; // 缺失可能插入已渲染区间——强制重建
      state.rendered = 0;
      failedRenderIds.clear(); // 重建会重新渲染全部——失败会重新登记
      const { skipped } = appendMessages(false);
      // orc-3 #5——渲染失败时不得推进水位（与 poll 同规则）：失败消息留在
      // 未读，下次对账重试；否则水位越过它且 inbox 不再返回，只剩整页刷新
      const maxTs = msgs.reduce((mx, m) => Math.max(mx, m.createdAt), 0);
      if (maxTs > 0 && skipped === 0) {
        void api("/read", {
          method: "POST",
          body: JSON.stringify({ roomId, sessionID: LS.sessionID, ts: maxTs }),
        }).catch(() => {});
      }
    } catch { /* 网络错误——下次对账 */ }
  }

  async function refreshRoomMeta() {
    const roomId = state.room?.id;
    if (!roomId) return;
    try {
      const room = await api(`/rooms/${encodeURIComponent(roomId)}`);
      // orc-2 #4——await 期间可能已切换房间：丢弃过期响应
      if (state.room && state.room.id === roomId) {
        state.room.participants = room.participants;
        renderMembers();
      }
    } catch { /* 下次 system 事件再试 */ }
  }

  function setOnline(ok) { $("#connBar").hidden = ok; }

  /* ---------- 发送 ---------- */
  function send() {
    const input = $("#msgInput");
    const text = input.value.trim();
    if (!text || !state.room) return;
    closeMention();
    input.value = "";
    autoGrow(input);
    updateSendState();
    hideSendError();
    api(`/rooms/${encodeURIComponent(state.room.id)}/messages`, {
      method: "POST",
      body: JSON.stringify({ sessionID: LS.sessionID, text }),
    })
      .then((room) => {
        state.room = room;
        appendMessages(true);
        $("#thread").scrollTop = $("#thread").scrollHeight; // 发送后回到底部
        renderMembers();
        state.unread = 0;
        updateBadge();
        updateJump();
      })
      .catch((e) => {
        input.value = text; // 失败时把消息还回来，提示重试
        autoGrow(input);
        updateSendState();
        if (e.status === 401) { openChatSettings(); showSendError("发送失败：需要访问令牌"); }
        else showSendError(e.network ? "发送失败：网络连接中断，消息已保留，可稍后重试" : `发送失败：${e.message}`);
      });
  }
  function showSendError(msg) {
    const el = $("#sendError");
    el.textContent = msg;
    el.hidden = false;
  }
  function hideSendError() { $("#sendError").hidden = true; }

  /* ---------- 离开 ---------- */
  function leaveRoom(silent) {
    stopPolling();
    closeMention();
    const roomId = state.room ? state.room.id : "";
    state.room = null;
    state.myName = "";
    state.rendered = 0;
    state.firstMsgId = null;
    state.unread = 0;
    LS.roomId = "";
    LS.name = "";
    $("#msgList").textContent = "";
    $("#msgInput").disabled = true;
    $("#btnSend").disabled = true;
    updateBadge();
    updateJump();
    if (!silent && roomId) {
      api(`/rooms/${encodeURIComponent(roomId)}/leave`, {
        method: "POST",
        body: JSON.stringify({ sessionID: LS.sessionID }),
      }).catch(() => {});
    }
    showJoin();
  }

  /* ---------- 已有房间列表 ---------- */
  async function refreshRoomList() {
    const list = $("#roomList");
    const empty = $("#roomListEmpty");
    empty.textContent = "还没有房间，创建一个吧。";
    try {
      const rooms = await api("/rooms");
      list.textContent = "";
      empty.hidden = rooms.length > 0;
      for (const r of rooms.slice(0, 20)) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "room-row";
        btn.title = "点击直接加入";
        const nm = document.createElement("span");
        nm.className = "r-name";
        nm.textContent = r.name;
        const meta = document.createElement("span");
        meta.className = "r-meta";
        meta.textContent = `${r.participants.length} 人 · ${r.messages.length} 条消息`;
        const go = document.createElement("span");
        go.className = "r-go";
        go.textContent = "加入 →";
        btn.append(nm, meta, go);
        btn.addEventListener("click", () => {
          $("#inRoomId").value = r.id;
          doJoin(r.id, $("#inName").value.trim() || "访客"); // 一键加入，昵称未填则用“访客”
        });
        li.appendChild(btn);
        list.appendChild(li);
      }
    } catch (e) {
      if (e.status === 401) openTokenBox();
      else {
        // 网络失败：加入/创建仍可用，列表给个说明
        empty.hidden = false;
        empty.textContent = "无法加载房间列表，可直接输入房间 ID 加入。";
      }
    }
  }

  /* ---------- 面板与令牌 ---------- */
  function closePanels() {
    let any = false;
    document.querySelectorAll(".panel").forEach((p) => { if (!p.hidden) any = true; p.hidden = true; });
    return any;
  }
  function togglePanel(sel) {
    const p = document.querySelector(sel);
    const wasHidden = p.hidden;
    closePanels();
    p.hidden = !wasHidden;
    const btn = document.querySelector(sel === "#memberPanel" ? "#btnMembers" : "#btnSettings");
    btn.setAttribute("aria-expanded", String(!wasHidden));
    if (!wasHidden) {
      lastFocus = document.activeElement;
      const h = p.querySelector("h3");
      h.tabIndex = -1;
      h.focus();
    }
  }
  function openTokenBox() { $("#tokenBox").open = true; }
  function openChatSettings() {
    closePanels();
    $("#chatSettings").hidden = false;
    $("#btnSettings").setAttribute("aria-expanded", "true");
    lastFocus = $("#btnSettings");
    $("#tokenHint").hidden = false;
    $("#inTokenChat").focus();
  }

  /* ---------- @提及 ---------- */
  const mention = { active: false, start: 0, query: "", items: [], index: 0 };
  const MENTION_RE = /<at>@([^<]+)<\/at>/g;
  const MENTION_HINT = document.createElement("p");
  MENTION_HINT.className = "mention-hint";
  MENTION_HINT.textContent = "↑↓ 选择 · Enter 确认 · Esc 关闭";

  // Markdown 最小子集渲染：粗体 / 斜体 / 行内代码 / 链接 / 围栏代码 / 列表 / 引用。
  // 全部用 DOM API + textContent 构建，不用 innerHTML；任何未闭合或畸形的标记
  // 都退化为字面文本，不会破坏布局或注入 HTML。
  const MD_FENCE = /^```/;
  const MD_QUOTE = /^>\s?/;
  const MD_UL = /^\s*[-*+]\s+(.*)$/;
  const MD_OL = /^\s*\d+\.\s+(.*)$/;
  const MD_INLINE = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|\[([^\]\n]+)\]\(([^)\n]*)\)/g;

  // 行内渲染：先按 <at>@名字</at> 拆提及（提及优先，提及内部永不做 Markdown），
  // 纯文本段再做行内格式化。提及是否高亮蓝色取决于当前房间成员名单。
  function renderInline(root, text) {
    const parts = String(text).split(MENTION_RE);
    const names = mentionNames();
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        const chip = document.createElement("span");
        chip.className = "mention-chip";
        if (names.has(parts[i])) chip.classList.add("member");
        chip.textContent = "@" + parts[i];
        root.appendChild(chip);
      } else if (parts[i]) {
        formatInline(root, parts[i]);
      }
    }
  }

  function formatInline(root, text) {
    MD_INLINE.lastIndex = 0;
    let last = 0, m;
    while ((m = MD_INLINE.exec(text))) {
      if (m.index > last) root.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1]) { // 行内代码
        const code = document.createElement("code");
        code.textContent = m[1].slice(1, -1);
        root.appendChild(code);
      } else if (m[2]) { // 粗体
        const strong = document.createElement("strong");
        strong.textContent = m[2].slice(2, -2);
        root.appendChild(strong);
      } else if (m[3]) { // 斜体
        const em = document.createElement("em");
        em.textContent = m[3].slice(1, -1);
        root.appendChild(em);
      } else { // 链接：href 仅允许 http/https，否则按纯文本显示
        const url = m[5];
        if (/^https?:\/\//i.test(url)) {
          const a = document.createElement("a");
          a.href = url;
          a.textContent = m[4];
          a.rel = "noopener noreferrer";
          a.target = "_blank";
          root.appendChild(a);
        } else {
          root.appendChild(document.createTextNode(m[0]));
        }
      }
      last = m.index + m[0].length;
    }
    if (last < text.length) root.appendChild(document.createTextNode(text.slice(last)));
  }

  function renderList(root, tag, re, lines, i, first) {
    const list = document.createElement(tag);
    const item = (content) => {
      const li = document.createElement("li");
      renderInline(li, content);
      list.appendChild(li);
    };
    item(first);
    i++;
    while (i < lines.length) {
      const m = re.exec(lines[i]);
      if (!m) break; // 换个列表符号就结束本列表，交给外层循环重新识别
      item(m[1]);
      i++;
    }
    root.appendChild(list);
    return i;
  }

  // 块级解析：逐行扫描产出 p / pre / ul / ol / blockquote，行内内容交给 renderInline
  function renderMarkdown(root, text) {
    const lines = String(text).split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];

      if (MD_FENCE.test(line)) { // 围栏代码块（``` 后可跟语言，不展示）；未闭合则到消息末尾
        const buf = [];
        i++;
        while (i < lines.length && !MD_FENCE.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // 跳过闭合围栏行
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = buf.join("\n");
        pre.appendChild(code);
        root.appendChild(pre);
        continue;
      }

      let m = MD_UL.exec(line);
      if (m) { i = renderList(root, "ul", MD_UL, lines, i, m[1]); continue; }
      m = MD_OL.exec(line);
      if (m) { i = renderList(root, "ol", MD_OL, lines, i, m[1]); continue; }

      if (MD_QUOTE.test(line)) { // 引用：连续 > 行合并为一个块
        const buf = [];
        while (i < lines.length) {
          const q = MD_QUOTE.exec(lines[i]);
          if (!q) break;
          buf.push(lines[i].slice(q[0].length));
          i++;
        }
        const bq = document.createElement("blockquote");
        renderInline(bq, buf.join("\n"));
        root.appendChild(bq);
        continue;
      }

      if (!line.trim()) { i++; continue; } // 空行：段落分隔

      // 段落：连续的非空、非块起始行；换行保留（.msg-text 为 pre-line）
      const buf = [line];
      i++;
      while (i < lines.length && lines[i].trim()
          && !MD_FENCE.test(lines[i]) && !MD_QUOTE.test(lines[i])
          && !MD_UL.test(lines[i]) && !MD_OL.test(lines[i])) {
        buf.push(lines[i]);
        i++;
      }
      const p = document.createElement("p");
      renderInline(p, buf.join("\n"));
      root.appendChild(p);
    }
  }

  // 消息正文入口：<at>@名字</at> 负载对 Markdown 语法是惰性的（不含 *、`、[ ] 等，
  // 且总是以 < 开头，不会误判为块起始），所以块结构按原文解析、提及在行内拆分渲染，
  // 两者互不污染：提及永远保持为 chip，Markdown 永不进入 chip 内部。
  function renderTextWithMentions(root, text) {
    renderMarkdown(root, text);
  }

  // 光标处的 @ 查询：@ 前必须是行首/空白/标点（不在单词中间）才算有效位置
  // SKIP_CHAR: 跳过 @ 后的查询文本（中文+字母+数字）；ASCII_WORD: 英文
  // mid-word 保护（"email@x" 不触发），中文前输入 @ 正常触发（"你好@小明"）
  const SKIP_CHAR = /[\p{L}\p{N}_]/u;
  const ASCII_WORD = /[A-Za-z0-9_]/;
  function currentMention(input) {
    const pos = input.selectionStart;
    const val = input.value;
    let s = pos;
    while (s > 0 && SKIP_CHAR.test(val[s - 1])) s--;
    if (s > 0 && val[s - 1] === "@" && (s - 1 === 0 || !ASCII_WORD.test(val[s - 2]))) {
      return { start: s - 1, query: val.slice(s, pos) };
    }
    return null;
  }

  function mentionNames() {
    const names = new Set();
    for (const p of (state.room && state.room.participants) || []) {
      // 不包含自己：@ 自己没有意义
      if (p.name !== state.myName) names.add(p.name);
    }
    return names;
  }

  // 前缀优先、其次包含；不区分大小写
  function filterMention(q) {
    const ql = q.toLowerCase();
    const prefix = [], sub = [];
    for (const n of mentionNames()) {
      if (!n) continue;
      const nl = n.toLowerCase();
      if (nl.startsWith(ql)) prefix.push(n);
      else if (nl.includes(ql)) sub.push(n);
    }
    return prefix.concat(sub);
  }

  function highlightMention() {
    const input = $("#msgInput");
    const picker = $("#mentionPicker");
    const opts = picker.querySelectorAll(".mention-opt");
    if (!mention.items.length) { input.removeAttribute("aria-activedescendant"); return; }
    opts.forEach((el, i) => {
      el.classList.toggle("active", i === mention.index);
      el.setAttribute("aria-selected", i === mention.index ? "true" : "false");
    });
    const el = opts[mention.index];
    input.setAttribute("aria-activedescendant", el.id);
    const ul = picker.querySelector("ul");
    if (el.offsetTop < ul.scrollTop) ul.scrollTop = el.offsetTop;
    else if (el.offsetTop + el.offsetHeight > ul.scrollTop + ul.clientHeight)
      ul.scrollTop = el.offsetTop + el.offsetHeight - ul.clientHeight;
  }

  function updateMentionList(query) {
    mention.query = query;
    mention.items = filterMention(query);
    mention.index = mention.items.length ? 0 : -1;
    const picker = $("#mentionPicker");
    picker.textContent = "";
    const ul = document.createElement("ul");
    mention.items.forEach((name, i) => {
      const li = document.createElement("li");
      li.className = "mention-opt";
      li.id = `mention-opt-${i}`;
      li.setAttribute("role", "option");
      li.dataset.name = name;
      const at = document.createElement("span");
      at.className = "mention-at";
      at.textContent = "@";
      li.appendChild(at);
      // 命中部分高亮
      const nl = name.toLowerCase();
      const ql = mention.query.toLowerCase();
      const idx = ql ? nl.indexOf(ql) : -1;
      if (idx < 0) li.appendChild(document.createTextNode(name));
      else {
        if (idx > 0) li.appendChild(document.createTextNode(name.slice(0, idx)));
        const hit = document.createElement("span");
        hit.className = "mention-hit";
        hit.textContent = name.slice(idx, idx + mention.query.length);
        li.appendChild(hit);
        li.appendChild(document.createTextNode(name.slice(idx + mention.query.length)));
      }
      ul.appendChild(li);
    });
    picker.appendChild(ul);
    if (!mention.items.length) {
      const empty = document.createElement("p");
      empty.className = "mention-empty";
      empty.textContent = "没有匹配的成员";
      picker.appendChild(empty);
    }
    picker.appendChild(MENTION_HINT);
    highlightMention();
  }

  function openMention(start, query) {
    mention.active = true;
    mention.start = start;
    updateMentionList(query);
    $("#mentionPicker").hidden = false;
    $("#msgInput").setAttribute("aria-expanded", "true");
  }

  function closeMention() {
    if (!mention.active) return;
    mention.active = false;
    mention.items = [];
    mention.index = 0;
    $("#mentionPicker").hidden = true;
    const input = $("#msgInput");
    input.removeAttribute("aria-expanded");
    input.removeAttribute("aria-activedescendant");
  }

  function recomputeMention() {
    const input = $("#msgInput");
    const m = currentMention(input);
    if (m) {
      // 命中：弹框未开则打开，已开则更新过滤
      if (mention.active) updateMentionList(m.query);
      else openMention(m.start, m.query);
    } else if (mention.active) {
      // 弹框已开但边界扫描未命中：只要 @ 还在输入框里就保持弹框
      // （仅更新过滤），避免 keydown 打开后被 input 事件链立刻误关；
      // @ 被删除/移动后才关闭
      const val = input.value;
      if (val.includes("@")) {
        const at = val.lastIndexOf("@");
        // ponytail: orc-1 #6 — 同步更新 mention.start，避免第二个 @ 时
        // 插入替换到旧位置
        mention.start = at;
        updateMentionList(val.slice(at + 1, input.selectionStart));
      } else {
        closeMention();
      }
    }
  }

  function moveMention(d) {
    const n = mention.items.length;
    if (!n) return;
    mention.index = (mention.index + d + n) % n;
    highlightMention();
  }

  // 把光标处的 @查询 替换为 <at>@名字</at>，光标放到末尾
  function insertMention(name) {
    const input = $("#msgInput");
    const end = mention.start + 1 + mention.query.length;
    if (input.value.slice(mention.start, end) !== "@" + mention.query) { closeMention(); return; } // 内容变了就放弃
    input.setRangeText(`<at>@${name}</at>`, mention.start, end, "end");
    closeMention();
    autoGrow(input);
    updateSendState();
    input.focus({ preventScroll: true });
  }

  /* ---------- 事件 ---------- */
  function wireEvents() {
    $("#joinForm").addEventListener("submit", (e) => { e.preventDefault(); joinRoom(); });
    $("#createForm").addEventListener("submit", (e) => { e.preventDefault(); createRoom(); });
    $("#btnSend").addEventListener("click", send);
    $("#btnJump").addEventListener("click", jumpToBottom);
    $("#btnCopyId").addEventListener("click", copyRoomId);
    $("#msgInput").addEventListener("keydown", (e) => {
      // ponytail: @ 弹框由 input 事件统一驱动（recomputeMention）——之前
      // 为绕过 scroll 误关打的多条补丁（keydown 即弹、doc-capture）已随
      // 根因修复移除；此处只处理弹框开启后的键盘导航
      if (mention.active && !e.isComposing) {
        if (e.key === "ArrowDown") { e.preventDefault(); moveMention(1); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); moveMention(-1); return; }
        if (e.key === "Escape") { e.preventDefault(); closeMention(); return; }
        if (e.key === "Enter" || e.key === "Tab") {
          if (mention.items.length) {
            e.preventDefault();
            insertMention(mention.items[mention.index]);
            return;
          }
          closeMention();
          if (e.key === "Tab") return; // 无匹配时 Tab 照常离开
          // Enter 无匹配：落到下面的发送逻辑
        }
      }
      // Enter 发送（Ctrl+Enter 也发送，Shift+Enter 换行）；isComposing: 中文输入法组词回车不误发
      if (e.key === "Enter" && !e.isComposing && (e.ctrlKey || !e.shiftKey)) {
        e.preventDefault();
        send();
      }
    });
    $("#msgInput").addEventListener("input", (e) => {
      autoGrow($("#msgInput"));
      updateSendState();
      // ponytail: 不因 isComposing 跳过——中文输入法下 @ 上屏的 input 事件
      // 可能带 composing 标志，跳过会导致弹框永不打开；组词产生的候选
      // 字符不含 @，recomputeMention 天然无害
      recomputeMention();
    });
    $("#msgInput").addEventListener("keyup", (e) => {
      // 左右方向键 / Home / End 移动了光标后重新定位（上下键已被面板占用）
      if (mention.active && !e.isComposing && /^(ArrowLeft|ArrowRight|Home|End)/.test(e.key)) recomputeMention();
    });
    $("#msgInput").addEventListener("click", recomputeMention);
    $("#msgInput").addEventListener("blur", closeMention);
    $("#mentionPicker").addEventListener("mousedown", (e) => {
      const opt = e.target.closest(".mention-opt");
      if (!opt) return;
      e.preventDefault(); // 阻止 textarea 失焦，blur 就不会抢先关面板
      insertMention(opt.dataset.name);
    });
    ["#inRoomId", "#inName", "#inRoomName"].forEach((s) => {
      $(s).addEventListener("input", hideJoinError);
    });
    $("#thread").addEventListener("scroll", () => {
      // ponytail: 不在此处 closeMention——弹框打开引起的布局/滚动位置
      // 调整会触发 scroll 事件，无条件关闭会让弹框"打开即消失"；
      // 弹框只由用户明确操作（Esc/点击外部/失焦/插入/发送）关闭
      const sc = $("#thread");
      if (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80) {
        state.unread = 0;
        updateBadge();
      }
      updateJump();
    });
    $("#btnLeave").addEventListener("click", () => leaveRoom(false));
    $("#btnMembers").addEventListener("click", () => togglePanel("#memberPanel"));
    $("#btnSettings").addEventListener("click", () => togglePanel("#chatSettings"));

    document.addEventListener("click", (e) => {
      const save = e.target.closest("[data-token-save]");
      if (save) {
        const input = document.getElementById(save.dataset.tokenSave);
        LS.token = input.value.trim();
        input.value = LS.token;
        $("#inToken").value = LS.token;
        $("#inTokenChat").value = LS.token;
        flash(save, "已保存");
        return;
      }
      if (mention.active && !e.target.closest("#mentionPicker")) closeMention();
      if (!e.target.closest(".anchor")) closePanels();
    });
    // ponytail: 不用 pagehide 自动 leave——它无法区分关闭/后台/bfcache，
    // 刷新竞态会把新 join 的条目删掉（orc-1 #2）；死条目由 join 清理 +
    // claim 窗口限制影响，可接受
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && (closePanels() || mention.active)) {
        e.preventDefault();
        closeMention();
        if (lastFocus) lastFocus.focus();
      }
    });
  }

  /* ---------- 启动 ---------- */
  async function autoJoin() {
    const roomId = LS.roomId;
    const name = LS.name;
    if (!roomId || !name) return;
    $("#inRoomId").value = roomId;
    $("#inName").value = name;
    try {
      const room = await api(`/rooms/${encodeURIComponent(roomId)}/join`, {
        method: "POST",
        body: JSON.stringify({ sessionID: LS.sessionID, participantId: name, participantName: name }),
      });
      enterRoom(room, name);
    } catch (e) {
      LS.roomId = "";
      LS.name = "";
      if (e.status === 401) openTokenBox();
      else if (e.status === 404) showJoinError("上次的房间已不存在");
      else if (e.network) showJoinError("无法连接服务器，请检查网络后重试");
    }
  }

  $("#inToken").value = LS.token;
  $("#inTokenChat").value = LS.token;
  wireEvents();
  refreshRoomList();
  autoJoin();
  $("#inRoomId").focus();
})();
</script>
</body>
</html>
