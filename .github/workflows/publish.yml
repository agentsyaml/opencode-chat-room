name: Publish package

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Run all unit tests
        run: bun run test
      - name: Test release helper
        run: node --test scripts/publish-packages.test.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          CHAT_UI_BROWSER_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          test -f "$CHAT_UI_BROWSER_MODULE"
          for file in src/tests/web-*.test.ts; do bun test "$file" || exit; done

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - name: Smoke the server on Node.js
        run: node scripts/smoke-server.ts
      - name: Smoke the server on Bun
        run: bun run scripts/smoke-server.ts
      - name: Smoke the server on Deno
        run: deno run --allow-env --allow-read --allow-write --allow-net=127.0.0.1 scripts/smoke-server.ts
      # OpenTUI's native core supports Bun and Node 26.4+ (experimental FFI),
      # so the terminal client smoke runs on Bun here; the server keeps all three.
      - name: Smoke the terminal client on Bun
        run: bun run scripts/tui-compat.mjs

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: codex-chat-room
            verify: "npm pack --dry-run --json > /dev/null"
          - package: dsh-chat-room
            verify: "node scripts/verify-package.mjs"
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run test
      - name: Build package
        if: matrix.package == 'dsh-chat-room'
        run: bun run build
      - name: Pack and verify package
        run: ${{ matrix.verify }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, browser, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: node -e 'const fs = require("node:fs"); const { version } = JSON.parse(fs.readFileSync("package.json", "utf8")); const expected = `v${version}`; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Expected tag ${expected}, got ${process.env.GITHUB_REF_NAME}`); process.exit(1); }'

      - name: Validate package contents
        run: |
          npm pack --dry-run --json > npm-pack.json
          node --input-type=module -e '
            import fs from "node:fs";
            const files = JSON.parse(fs.readFileSync("npm-pack.json", "utf8"))[0].files.map(file => file.path);
            const required = ["LICENSE", "skills/chatroom/SKILL.md", "server/http-server.ts", "src/state/sqlite.ts", "server/json-body.ts", "server/newrooms.ts", "server/member-routes.ts", "server/task-routes.ts", "src/rooms/tasks.ts", "src/agent/task-tool.ts", "server/announcement-routes.ts", "server/join-requests.ts", "server/room-join.ts", "server/message-recall-routes.ts", "src/config/file-config.ts", "src/tui/main.mjs", "src/tui/mentions.mjs", "src/tui/ui-suggest.mjs", "src/tui/ui-mentions.mjs", "src/tui/ui-suggest-view.mjs", "src/tui/markdown.mjs", "src/tui/message-view.mjs", "src/tui/info-app.mjs", "src/tui/info-content.mjs", "src/tui/ui-overlay-view.mjs", "src/tui/message-app.mjs", "src/tui/reminder-app.mjs", "src/tui/room-settings-app.mjs", "src/tui/palette-app.mjs", "dist/cli.js", "server/assets/chat/join-requests.js", "server/assets/chat/recall.js", "server/assets/chat/attachment-store.js", "server/assets/chat/install-prompt.js", "server/assets/chat/pwa.js", "server/assets/chat/shortcuts.js", "server/assets/chat/settings.js", "server/assets/chat/viewport.js", "server/assets/chat/create-room-dialog.js", "server/assets/chat/confirm-dialog.js", "server/assets/chat/search.js", "server/assets/chat/locales/index.js", "server/assets/settings.css", "server/assets/icons.css", "server/assets/fluent-icons.svg", "server/assets/FLUENT-ICONS-LICENSE", "server/assets/chat/icons.js", "server/assets/room-create.css", "server/assets/edit-room.css", "server/assets/palette.css", "server/assets/files.css", "server/assets/doc-preview.css", "server/assets/tasks.css", "server/assets/chat/palette.js", "server/assets/chat/files.js", "server/assets/chat/doc-preview.js", "server/assets/chat/shiki.js", "server/assets/chat/tasks.js", "server/assets/chat/task-form.js", "server/assets/chat/task-row.js", "server/assets/recall.css", "server/assets/code-highlight.css", "server/assets/NOTICE.txt", "server/assets/MARKED-LICENSE", "server/assets/DOMPURIFY-LICENSE", "server/assets/MERMAID-LICENSE", "server/assets/SHIKI-LICENSE", "server/assets/marked-18.0.4.js", "server/assets/dompurify-3.4.7.js", "server/assets/mermaid-11.12.2.min.js", "server/assets/shiki.bundle.js", "server/channels.ts", "server/addressing-routes.ts", "packages/chat-room-channeld/dist/mock-adapter.js", "packages/chat-room-channeld/dist/feishu-adapter.js"];
            const missing = required.filter(file => !files.includes(file));
            for (const file of ["server/resource-routes.ts", "src/rooms/resources.ts", "src/rooms/resource-upload.ts"]) if (!files.includes(file)) missing.push(file);
            const leaked = files.filter(file => /(?:\.test\.[cm]?[jt]sx?$|\.fixture(?:\.|\/)|(?:^|\/)fixtures?\/)/i.test(file));
            if (missing.length || leaked.length) { console.error({ missing, leaked }); process.exit(1); }
          '

      - name: Publish to npm
        run: npm publish --access public

  package-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, browser, packages, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build dsh package
        run: bun run --cwd packages/dsh-chat-room build
      - name: Publish changed packages
        run: node scripts/publish-packages.mjs --publish packages/codex-chat-room packages/dsh-chat-room

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
